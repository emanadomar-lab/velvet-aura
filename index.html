                btn.className = `w-full text-right px-3 py-2 rounded-xl text-xs transition flex justify-between items-center ${idx === currentActiveIdx ? 'bg-softblush text-warmespresso border-r-4 border-champagnegold font-bold shadow-sm' : 'text-warmespresso/70 hover:bg-warmivory hover:text-warmespresso'}`;

            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function saveInput(id) {
            const elem = document.getElementById(id);
            if (elem) {
                const val = elem.type === 'checkbox' ? elem.checked : elem.value;
                localStorage.setItem('velvet_' + id, val);
            }
        }

        function loadSavedInputs() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                if (input.id) {
                    const saved = localStorage.getItem('velvet_' + input.id);
                    if (saved !== null) {
                        if (input.type === 'checkbox') input.checked = (saved === 'true');
                        else input.value = saved;
                    }
                }
            });
        }

        window.onload = initCopyEngine;
    </script>
</body>
</html>
